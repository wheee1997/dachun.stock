
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>庫存統計</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
.wrap{max-width:460px;margin:auto;padding:9px 7px 30px}
h1{font-size:21px;margin:6px 0 10px}
h2{font-size:16px;margin:0 0 10px}
.card{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:10px;margin-bottom:9px}
button{border:0;border-radius:8px;padding:9px 12px;font-size:13px;font-weight:700;cursor:pointer}
.primary{background:#2563eb;color:white}
.secondary{background:#e9eef5;color:#334155}
.note{font-size:11px;color:#64748b;line-height:1.5;margin:7px 0}
input[type=number],select{width:100%;height:35px;border:1px solid #cbd5e1;border-radius:7px;background:white;color:#111827;text-align:center;font-size:15px}
input:focus,select:focus{outline:2px solid #bfdbfe;border-color:#2563eb}
.bucket-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px 3px}
.bucket{position:relative;aspect-ratio:1;min-width:0;border:1.5px solid #cbd5e1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#f8fafc;padding:2px}
.bucket .name,.water-circle .name{font-size:10px;font-weight:800;text-align:center;line-height:1.1;overflow-wrap:anywhere}
.bucket input{width:82%;height:22px;font-size:12px;padding:0;border-radius:5px}
.bucket.empty{border:2px dashed #94a3b8;background:white;cursor:pointer}
.bucket .plus{font-size:24px;color:#2563eb}
.bucket .count{font-size:9px;color:#64748b}
.bucket .remove,.water-circle .remove{position:absolute;top:-5px;right:-4px;width:19px;height:19px;min-height:0;padding:0;border-radius:50%;background:#fecaca;color:#991b1b;font-size:14px;z-index:2}
.bucket.fixed{background:#f1f5f9}
.bucket.tricolor,.water-circle.tricolor{background:#fff7ed;border-color:#f59e0b}
.bucket.filled,.water-circle{background:#ecfdf5;border-color:#86efac}

/* 後面水冰箱 */
.water-tray{position:relative;border:2px solid #cbd5e1;border-radius:18px;background:#f8fafc;min-height:172px;padding:14px 9px 57px}
.water-circles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px 5px;align-items:start}
.water-circle{position:relative;border:1.5px solid #86efac;border-radius:50%;aspect-ratio:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:3px}
.water-add{position:absolute;right:12px;bottom:10px;border-radius:50%;width:42px;height:42px;font-size:27px;padding:0;line-height:1;background:#2563eb;color:white}
.empty-hint{text-align:center;color:#94a3b8;font-size:12px;padding:36px 0}

/* 選擇視窗 */
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}
.dialog{background:white;width:100%;max-width:350px;border-radius:14px;padding:18px}
.dialog h3{font-size:17px;margin:0 0 14px}
.dialog label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.dialog select,.dialog input{height:42px;margin-bottom:12px}
.dialog-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}

/* 選料冰箱 */
.pudding{background:#f8fafc;border-radius:9px;padding:9px;margin-bottom:8px}
.pudding-top{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:8px}
.fields,.two-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.field,.compact{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700}
.compact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.compact{background:#f8fafc;padding:7px 5px;border-radius:8px;text-align:center}
.compact input{height:32px}
.stove{display:flex;gap:8px}
.stove label{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:#f1f5f9;border-radius:8px;padding:11px;font-size:13px;font-weight:700}

/* 收店確認與冰箱溫度 */
.check-row,.temp-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #eef2f7;padding:9px 0}
.check-row:last-child,.temp-row:last-child{border-bottom:0}
.check-btn{min-width:85px;background:#e2e8f0;color:#475569}
.check-btn.yes{background:#dcfce7;color:#166534}
.temp-name{font-size:13px;font-weight:700}
.temp-note{font-size:10px;color:#64748b;line-height:1.4;margin-top:2px}
.temp-right{display:flex;align-items:center;gap:3px;flex-shrink:0}
.temp-right input{width:65px;height:34px}

/* 合計 */
.total-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.total-heading h2{margin:0}
.total-row{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px solid #f1f5f9;font-size:13px}
.total-row strong{font-size:15px}
.message{font-size:12px;color:#047857;min-height:18px;margin:6px 0}
@media(max-width:370px){
.wrap{padding-left:4px;padding-right:4px}
.card{padding:7px}
.bucket-grid{gap:3px 2px}
.bucket .name,.water-circle .name{font-size:9px}
.bucket input{height:20px;font-size:11px}
.water-circles{gap:6px 3px}
}
</style>
</head>

<body>
<main class="wrap">
<h1>庫存統計</h1>

<div style="margin-bottom:10px">
<button class="secondary" id="clearBtn">清除資料</button>
</div>

<!-- 前面三色冰箱 -->
<section class="card">
<h2>前面三色冰箱</h2>
<div class="bucket-grid" id="frontGrid"></div>
</section>

<!-- 前面選料冰箱 -->
<section class="card">
<h2>前面選料冰箱</h2>
<div class="pudding">
<div class="pudding-top">
<span>布丁</span>
<span id="puddingTotal">合計 0 個</span>
</div>
<div class="fields">
<label class="field">
完整盒數（12 個／盒）
<input id="puddingBoxes" type="number" min="0" step="1" inputmode="numeric" placeholder="盒數">
</label>
<label class="field">
單個數量
<input id="puddingSingles" type="number" min="0" step="1" inputmode="numeric" placeholder="個數">
</label>
</div>
</div>

<div class="compact-grid">
<label class="compact">
牛奶
<input id="ingredientMilk" type="number" min="0" step="any" inputmode="decimal" placeholder="數量">
</label>
<label class="compact">
杏仁豆腐
<input id="ingredientAlmond" type="number" min="0" step="1" inputmode="numeric" placeholder="數量">
</label>
<label class="compact">
黑糖粉粿
<input id="ingredientJelly" type="number" min="0" step="1" inputmode="numeric" placeholder="數量">
</label>
</div>
</section>

<!-- 小白板 -->
<section class="card">
<h2>小白板</h2>
<div class="two-grid">
<label class="compact">
杏仁豆腐
<input id="whiteAlmond" type="number" min="0" step="1" inputmode="numeric" placeholder="數量">
</label>
<label class="compact">
豆花
<input id="whiteTofu" type="number" min="0" step="1" inputmode="numeric" placeholder="數量">
</label>
</div>
</section>

<!-- 後面水冰箱 -->
<section class="card">
<h2>後面水冰箱</h2>
<div class="water-tray">
<div class="water-circles" id="waterCircles"></div>
<button class="water-add" id="waterAdd" type="button" aria-label="新增水冰箱品項">＋</button>
</div>
</section>

<!-- 後面廚房冰箱 -->
<section class="card">
<h2>後面廚房冰箱</h2>
<div class="compact-grid">
<label class="compact">
牛奶
<input id="kitchenMilk" type="number" min="0" step="1" inputmode="numeric" placeholder="數量">
</label>
<label class="compact">
粉粿
<input id="kitchenJelly" type="number" min="0" step="1" inputmode="numeric" placeholder="數量">
</label>
<label class="compact">
杏仁豆腐
<input id="kitchenAlmond" type="number" min="0" step="1" inputmode="numeric" placeholder="數量">
</label>
</div>
</section>

<!-- 廚房瓦斯爐 -->
<section class="card">
<h2>廚房瓦斯爐</h2>
<div class="stove">
<label>
<input type="radio" name="stove" value="yes">
有（＋2）
</label>
<label>
<input type="radio" name="stove" value="no" checked>
沒有（＋0）
</label>
</div>
</section>

<!-- 薑汁 -->
<section class="card">
<h2>薑汁</h2>
<label class="compact">
薑汁數量（可輸入小數）
<input id="ginger" type="number" min="0" step="any" inputmode="decimal" placeholder="輸入數量">
</label>
</section>

<!-- 收店確認 -->
<section class="card">
<h2>收店確認</h2>
<div class="check-row">
<strong>確認加熱器關了</strong>
<button class="check-btn" id="heaterBtn">未確認</button>
</div>
<div class="check-row">
<strong>窗戶是否關了</strong>
<button class="check-btn" id="windowBtn">未確認</button>
</div>
</section>

<!-- 商品庫存合計 -->
<section class="card">
<div class="total-heading">
<h2>商品庫存合計</h2>
<button class="primary" id="copyBtn">複製文字</button>
</div>
<div id="totals"></div>
</section>

<!-- 冰箱溫度 -->
<section class="card">
<h2>冰箱溫度</h2>
<div id="temperatures"></div>
</section>

<div class="message" id="message" role="status"></div>
<p class="note">資料會自動儲存在目前裝置的瀏覽器中，不同裝置不會自動同步。</p>
</main>

<!-- 新增品項視窗 -->
<div class="modal" id="picker">
<div class="dialog">
<h3 id="pickerTitle">選擇品項</h3>
<label for="pickerChoice">品項</label>
<select id="pickerChoice"></select>

<div id="qtyArea" style="display:none">
<label for="pickerQty">數量</label>
<input id="pickerQty" type="number" min="1" step="1" inputmode="numeric" value="1">
</div>

<p id="pickerHint" class="note"></p>
<div class="dialog-actions">
<button class="secondary" id="pickerCancel">取消</button>
<button class="primary" id="pickerConfirm">確認加入</button>
</div>
</div>
</div>

<script>
"use strict";

// 儲存資料
const KEY="dachun_stock_complete_v2";

// 前面三色冰箱可選品項
const FRONT_OPTIONS=[
"杏仁茶","紫米粥","豆漿","仙草",
"愛玉","豆花","糖水"
];

// 後面水冰箱可選品項
const WATER_OPTIONS=[
"豆花","豆漿","三色豆花","愛玉",
"糖水","杏仁茶","仙草","紫米粥"
];

// 前面三色冰箱固定桶位
const FRONT_NAMES={
1:"杏仁茶",
2:"紫米粥",
4:"豆漿",
5:"三色豆花",
6:"三色豆花",
7:"三色豆花",
8:"仙草",
12:"愛玉",
13:"豆花",
14:"糖水"
};

const EXTRA=[3,9,10,11];

// 完全不計算的品項
const NO_COUNT=["紫米粥","仙草"];

const FIELDS=[
"puddingBoxes","puddingSingles",
"ingredientMilk","ingredientAlmond",
"ingredientJelly","whiteAlmond",
"whiteTofu","kitchenMilk",
"kitchenJelly","kitchenAlmond","ginger"
];

const DECIMAL_FIELDS=["ingredientMilk","ginger"];

const FRIDGES=[
{key:"front",name:"前面 三色冷藏冰箱",note:"檢查是否為 3°C"},
{key:"freezer",name:"前面 冷凍小冰箱",note:"檢查是否為 -7°C"},
{key:"water",name:"後面 水冰箱",note:"檢查是否結冰；結冰調整為 0°C，未結冰調整為 -1°C"}
];

const COPY_NAMES=[
"豆花","豆漿","三色","牛奶","布丁",
"糖水","愛玉","杏仁豆腐","杏仁茶",
"粉粿","薑汁"
];

const el=id=>document.getElementById(id);

const emptyState=()=>({
front:{},
frontExtras:{},
waterGroups:[],
fields:{},
temps:{},
stove:"no",
checks:{heater:false,window:false}
});

let state=emptyState();

// 讀取已儲存資料
try{
const raw=JSON.parse(localStorage.getItem(KEY)||"null");

if(raw&&typeof raw==="object"){
state={
...emptyState(),
front:raw.front||{},
frontExtras:raw.frontExtras||{},
fields:raw.fields||{},
temps:raw.temps||{},
stove:raw.stove==="yes"?"yes":"no",
checks:{
heater:!!raw.checks?.heater,
window:!!raw.checks?.window
}
};

if(Array.isArray(raw.waterGroups)){
state.waterGroups=raw.waterGroups.filter(
x=>x&&WATER_OPTIONS.includes(x.name)&&
Number.isInteger(x.qty)&&x.qty>0&&x.qty<=999
);
}else if(raw.water&&typeof raw.water==="object"){
// 將舊版水冰箱桶位轉成新版
state.waterGroups=Object.entries(raw.water)
.sort((a,b)=>Number(a[0])-Number(b[0]))
.filter(([,name])=>WATER_OPTIONS.includes(name))
.map(([,name])=>({name,qty:1}));
}
}
}catch(e){}

function save(){
try{
localStorage.setItem(KEY,JSON.stringify(state));
}catch(e){
notify("瀏覽器無法儲存，請確認儲存空間。");
}
}

function num(v){
if(v===null||v===undefined||v==="")return 0;
const n=Number(v);
return Number.isFinite(n)?Math.max(0,n):0;
}

function integer(v){
return Math.trunc(num(v));
}

function clean(v){
return Math.round((v+Number.EPSILON)*1000)/1000;
}

function normalized(s){
return s==="三色豆花"?"三色":
s==="黑糖粉粿"?"粉粿":s;
}

function add(out,name,qty){
if(NO_COUNT.includes(name))return;
const key=normalized(name);
out[key]=(out[key]||0)+qty;
}

function notify(s){
el("message").textContent=s;
clearTimeout(window.msgTimer);
window.msgTimer=setTimeout(()=>{
el("message").textContent="";
},3000);
}

// 建立圓形
function circle(name,cls="bucket"){
const b=document.createElement("div");
b.className=cls;

if(name){
const label=document.createElement("span");
label.className="name";
label.textContent=name;
b.append(label);
}
return b;
}

// 移除按鈕
function removeBtn(parent,action,label){
const b=document.createElement("button");
b.className="remove";
b.type="button";
b.textContent="×";
b.title=label;
b.setAttribute("aria-label",label);

b.onclick=e=>{
e.stopPropagation();
action();
};

parent.append(b);
}

// 加號按鈕
function plusBtn(b,action,label){
const s=document.createElement("span");
s.className="plus";
s.textContent="+";
b.append(s);

b.tabIndex=0;
b.setAttribute("role","button");
b.setAttribute("aria-label",label);
b.onclick=action;

b.onkeydown=e=>{
if(e.key==="Enter"||e.key===" "){
e.preventDefault();
action();
}
};
}

// 前面三色冰箱
function renderFront(){
const root=el("frontGrid");
root.replaceChildren();

for(let n=1;n<=14;n++){
let b;

if(EXTRA.includes(n)){
const name=state.frontExtras[n];

b=circle(
name||"",
"bucket "+(name?"filled":"empty")
);

if(name){
if(!NO_COUNT.includes(name)){
const s=document.createElement("span");
s.className="count";
s.textContent="× 1";
b.append(s);
}

removeBtn(b,()=>{
delete state.frontExtras[n];
save();
renderFront();
renderTotals();
},"移除此桶");

}else{
plusBtn(
b,
()=>openPicker("front",n),
"新增三色冰箱空桶"
);
}

}else{
b=circle(
FRONT_NAMES[n],
"bucket "+(
[5,6,7].includes(n)?"tricolor":
[2,8].includes(n)?"fixed":""
)
);

if(n===6||n===7){
const s=document.createElement("span");
s.className="count";
s.textContent="共用";
b.append(s);
}else if(n!==2&&n!==8){
const input=document.createElement("input");
input.type="number";
input.min="0";
input.step="any";
input.inputMode="decimal";
input.placeholder="0";
input.value=state.front[n]??"";

input.setAttribute(
"aria-label",
`${FRONT_NAMES[n]}數量`
);

input.oninput=()=>{
state.front[n]=input.value;
save();
renderTotals();
};

b.append(input);
}
}

root.append(b);
}
}

// 水冰箱目前顯示的圓形總數
function waterVisualCount(){
return state.waterGroups.reduce(
(n,g)=>n+g.qty*(g.name==="三色豆花"?3:1),
0
);
}

// 後面水冰箱
function renderWater(){
const root=el("waterCircles");
root.replaceChildren();

if(!state.waterGroups.length){
const hint=document.createElement("div");
hint.className="empty-hint";
hint.textContent="按右下角 ＋ 新增品項";
hint.style.gridColumn="1/-1";
root.append(hint);
return;
}

state.waterGroups.forEach((group,index)=>{
const repeat=group.qty*(
group.name==="三色豆花"?3:1
);

for(let i=0;i<repeat;i++){
const b=circle(
group.name,
"water-circle"+(
group.name==="三色豆花"?" tricolor":""
)
);

// 每組第一個圓形有移除按鈕
if(i===0){
removeBtn(b,()=>{
if(confirm(
`移除「${group.name}」${group.qty} 份嗎？`
)){
state.waterGroups.splice(index,1);
save();
renderWater();
renderTotals();
}
},`移除${group.name}${group.qty}份`);
}

root.append(b);
}
});
}

// 選擇品項
let pickerTarget=null;

function openPicker(type,n=null){
pickerTarget={type,n};

const options=type==="front"?
FRONT_OPTIONS:WATER_OPTIONS;

el("pickerTitle").textContent=
type==="front"?
"三色冰箱選擇品項":
"水冰箱新增品項";

el("pickerChoice").replaceChildren();

options.forEach(name=>{
const option=document.createElement("option");
option.value=name;
option.textContent=name;
el("pickerChoice").append(option);
});

el("qtyArea").style.display=
type==="water"?"block":"none";

el("pickerQty").value="1";

el("pickerHint").textContent=
type==="water"?
"輸入份數，會產生對應圓形。三色豆花每份顯示 3 個圓，但只算 1 份；仙草及紫米粥不計數。":
"仙草、紫米粥只顯示，其他品項每桶計算 1。";

el("picker").classList.add("open");
}

function closePicker(){
pickerTarget=null;
el("picker").classList.remove("open");
}

el("waterAdd").onclick=()=>openPicker("water");
el("pickerCancel").onclick=closePicker;

el("picker").onclick=e=>{
if(e.target===el("picker"))closePicker();
};

el("pickerConfirm").onclick=()=>{
if(!pickerTarget)return;

const name=el("pickerChoice").value;

if(pickerTarget.type==="front"){
state.frontExtras[pickerTarget.n]=name;
renderFront();

}else{
const qty=Number(el("pickerQty").value);

if(!Number.isInteger(qty)||qty<1||qty>999){
alert("請輸入 1～999 的整數數量。");
return;
}

const visualQty=qty*(
name==="三色豆花"?3:1
);

if(waterVisualCount()+visualQty>300){
alert("目前最多顯示 300 個圓形，請減少數量。");
return;
}

state.waterGroups.push({name,qty});
renderWater();
}

save();
renderTotals();
closePicker();
};

// 一般庫存輸入
function renderFields(){
FIELDS.forEach(id=>{
const input=el(id);
input.value=state.fields[id]??"";

input.oninput=()=>{
let v=input.value;

if(v!==""&&!DECIMAL_FIELDS.includes(id)){
const n=Number(v);

if(Number.isFinite(n)){
v=String(integer(v));
input.value=v;
}
}

state.fields[id]=v;
save();
renderTotals();
};
});

document.querySelectorAll(
'input[name="stove"]'
).forEach(input=>{
input.checked=input.value===state.stove;

input.onchange=()=>{
if(input.checked){
state.stove=input.value;
save();
renderTotals();
}
};
});
}

// 收店確認按鈕
function renderChecks(){
[
["heater","heaterBtn"],
["window","windowBtn"]
].forEach(([key,id])=>{
const b=el(id);

function paint(){
b.textContent=state.checks[key]?
"✓ 是":"未確認";

b.classList.toggle(
"yes",!!state.checks[key]
);
}

b.onclick=()=>{
state.checks[key]=!state.checks[key];
save();
paint();
};

paint();
});
}

// 冰箱溫度
function renderTemps(){
const root=el("temperatures");
root.replaceChildren();

FRIDGES.forEach(f=>{
const row=document.createElement("div");
row.className="temp-row";

const left=document.createElement("div");

const name=document.createElement("div");
name.className="temp-name";
name.textContent=f.name;

const note=document.createElement("div");
note.className="temp-note";
note.textContent=`（${f.note}）`;

left.append(name,note);

const right=document.createElement("div");
right.className="temp-right";

const input=document.createElement("input");
input.type="number";
input.min="-99";
input.max="99";
input.step="0.1";
input.placeholder="0";
input.value=state.temps[f.key]??"";

input.oninput=()=>{
state.temps[f.key]=input.value;
save();
};

const degree=document.createElement("span");
degree.textContent="°C";

right.append(input,degree);
row.append(left,right);
root.append(row);
});
}

// 計算所有商品總數
function totals(){
const out={};

// 前面三色冰箱
[1,4,5,12,13,14].forEach(n=>{
add(out,FRONT_NAMES[n],num(state.front[n]));
});

EXTRA.forEach(n=>{
const name=state.frontExtras[n];
if(FRONT_OPTIONS.includes(name)){
add(out,name,1);
}
});

const f=state.fields;

// 布丁，一盒 12 個
add(
out,"布丁",
integer(f.puddingBoxes)*12+
integer(f.puddingSingles)
);

// 前面選料冰箱
add(out,"牛奶",num(f.ingredientMilk));
add(out,"杏仁豆腐",integer(f.ingredientAlmond));
add(out,"粉粿",integer(f.ingredientJelly));

// 小白板
add(out,"杏仁豆腐",integer(f.whiteAlmond));
add(out,"豆花",integer(f.whiteTofu));

// 廚房冰箱
add(out,"牛奶",integer(f.kitchenMilk));
add(out,"粉粿",integer(f.kitchenJelly));
add(out,"杏仁豆腐",integer(f.kitchenAlmond));

// 廚房瓦斯爐
if(state.stove==="yes"){
add(out,"糖水",2);
}

// 薑汁
add(out,"薑汁",num(f.ginger));

// 後面水冰箱
// 三色豆花只計算選擇的份數
// 仙草、紫米粥由 add() 自動排除
state.waterGroups.forEach(g=>{
add(out,g.name,g.qty);
});

return out;
}

// 顯示商品庫存合計
function renderTotals(){
const map=totals();

el("puddingTotal").textContent=
`合計 ${
integer(state.fields.puddingBoxes)*12+
integer(state.fields.puddingSingles)
} 個`;

const root=el("totals");
root.replaceChildren();

COPY_NAMES.forEach(name=>{
const row=document.createElement("div");
row.className="total-row";

const a=document.createElement("span");
a.textContent=name;

const b=document.createElement("strong");
b.textContent=clean(map[name]||0);

row.append(a,b);
root.append(row);
});
}

// 產生複製文字
function makeCopyText(){
const map=totals();

const lines=COPY_NAMES.map(
name=>`${name}：${clean(map[name]||0)}`
);

lines.push("");
lines.push("冰箱溫度：");

FRIDGES.forEach(f=>{
const val=state.temps[f.key]??"";

lines.push(
`${f.name}：${val===""?"":val+"°C"}`
);
});

lines.push("");
lines.push("收店確認：");

lines.push(
`確認加熱器關了：${
state.checks.heater?"是":"未確認"
}`
);

lines.push(
`窗戶是否關了：${
state.checks.window?"是":"未確認"
}`
);

return lines.join("\n");
}

// 複製文字
async function copyText(){
const text=makeCopyText();

try{
await navigator.clipboard.writeText(text);
notify("已複製，可以直接貼到 LINE。");
}catch(e){
const area=document.createElement("textarea");
area.value=text;
document.body.append(area);
area.select();

let success=false;

try{
success=document.execCommand("copy");
}catch(err){}

area.remove();

if(success){
notify("已複製，可以直接貼到 LINE。");
}else{
const cover=document.createElement("div");
cover.className="modal open";

const d=document.createElement("div");
d.className="dialog";

const t=document.createElement("h3");
t.textContent="請手動複製文字";

const a=document.createElement("textarea");
a.value=text;
a.style.cssText="width:100%;height:260px";

const btn=document.createElement("button");
btn.className="primary";
btn.textContent="關閉";
btn.onclick=()=>cover.remove();

d.append(t,a,btn);
cover.append(d);
document.body.append(cover);
a.focus();
a.select();
}
}
}

// 清除資料
function clearData(){
if(!confirm(
"確定清除所有庫存、桶位品項、溫度及收店確認嗎？"
))return;

state=emptyState();
localStorage.removeItem(KEY);

renderFront();
renderWater();

FIELDS.forEach(id=>{
el(id).value="";
});

document.querySelector(
'input[name="stove"][value="no"]'
).checked=true;

renderChecks();
renderTemps();
renderTotals();

notify("資料已清除。");
}

// 綁定按鈕
el("copyBtn").onclick=copyText;
el("clearBtn").onclick=clearData;

// 啟動網頁
renderFront();
renderWater();
renderFields();
renderChecks();
renderTemps();
renderTotals();

</script>
</body>
</html>
